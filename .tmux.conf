unbind r
bind r source-file ~/.tmux.conf \; display-message "🔥 config reloaded 🔥"
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Plugin Manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect & Continuum
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'off'
set -g @continuum-save-interval '10'

# Mouse
set -g mouse on

#prefix change 
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Vi copy mode
set -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
unbind -T copy-mode-vi MouseDragEnd1Pane
set -g mode-style "fg=default,bg=#264f78"

#tmux sessionizer 
bind-key -r f run-shell "tmux new-window ~/.local/bin/tmux-sessionizer"

# Pane navigation
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Window navigation
bind -r l next-window
bind -r h previous-window
bind -n S-Left previous-window
bind -n S-Right next-window

# Splits
bind v split-window -h
bind s split-window -v

# Status bar
gray_light="#D8DEE9"
gray_medium="#ABB2BF"
gray_dark="#202530"
green_soft="#A3BE8C"
blue_muted="#81A1C1"
cyan_soft="#88C0D0"
magenta="#C099FF"

HALF_ROUND_CLOSE="\uE0B4"
HALF_ROUND_OPEN="\uE0b6"

set -g status-position bottom

set -g status-left-length 100
set -g status-right-length 100

set -g status-style "fg=${gray_light},bg=${gray_dark}"

#left side configuration
set -g status-left "\
#{?client_prefix,#[bg=${magenta}],#[bg=${blue_muted}]} \
#[fg=${gray_dark},bg=${blue_muted},bold]  #S\
#[fg=${blue_muted},bg=${gray_dark}]#{HALF_ROUND_CLOSE}   "

#right side configuration
set -g status-right "\
#{?client_prefix,#[fg=${magenta}],#[fg=${cyan_soft}]}#{HALF_ROUND_OPEN}\
#{?client_prefix,#[fg=${gray_dark}#,bg=${magenta}],#[fg=${gray_dark}#,bg=${cyan_soft}]}󰝰 #{b:pane_current_path} "


set -g window-status-current-format "#[fg=${cyan_soft},bold] #[underscore]#I:#W"
set -g window-status-format "#I:#W"
set-window-option -g window-status-separator "   "
set -g message-style "fg=${gray_light},bg=${gray_dark}"
set -g pane-border-style "fg=${gray_dark}"
set -g pane-active-border-style "fg=${gray_medium}"

# Initialize TPM (always keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
